name: M.M.F TikTok Sandbox Add Posting
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-sandbox-add-posting.mjs"
      - ".github/workflows/tiktok-sandbox-add-posting.yml"
permissions:
  contents: read
concurrency:
  group: mmf-tiktok-sandbox-add-posting
  cancel-in-progress: true
jobs:
  configure:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact product card selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/vps/tiktok-sandbox-add-posting.mjs')
          s=p.read_text()
          s=s.replace(
              "const t=titles[0].r.y+titles[0].r.height/2;",
              "const tx=titles[0].r.x+titles[0].r.width/2,ty=titles[0].r.y+titles[0].r.height/2;"
          )
          s=s.replace(
              "Math.abs((a.r.y+a.r.height/2)-t)-Math.abs((b.r.y+b.r.height/2)-t)",
              "Math.hypot((a.r.x+a.r.width/2)-tx,(a.r.y+a.r.height/2)-ty)-Math.hypot((b.r.x+b.r.width/2)-tx,(b.r.y+b.r.height/2)-ty)"
          )
          p.write_text(s)
          PY
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9254' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Add Content Posting product safely
        shell: bash
        run: node scripts/vps/tiktok-sandbox-add-posting.mjs
