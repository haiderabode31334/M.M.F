name: M.M.F TikTok Direct Mouse
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-direct-mouse.mjs"
      - ".github/workflows/tiktok-direct-mouse.yml"
permissions:
  contents: read
concurrency:
  group: mmf-tiktok-direct-mouse
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9257' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Persist Direct Post
        shell: bash
        run: node scripts/vps/tiktok-direct-mouse.mjs
