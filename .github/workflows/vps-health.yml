name: M.M.F VPS Health

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/health.sh"
      - ".github/workflows/vps-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run safe health check
        shell: bash
        run: bash scripts/vps/health.sh
