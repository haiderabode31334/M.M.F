name: M.M.F TikTok URL Verify React

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-url-verify-react.mjs"
      - ".github/workflows/tiktok-url-verify-react.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-url-verify-react
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9241' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Inspect TikTok React form state
        shell: bash
        run: node scripts/vps/tiktok-url-verify-react.mjs
