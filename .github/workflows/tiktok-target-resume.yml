name: M.M.F TikTok Target Resume

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-target-resume.mjs"
      - ".github/workflows/tiktok-target-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-target-resume
  cancel-in-progress: true

jobs:
  resume:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9262' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Resume TikTok target account connection
        shell: bash
        run: node scripts/vps/tiktok-target-resume.mjs
