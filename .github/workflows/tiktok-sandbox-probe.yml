name: M.M.F TikTok Sandbox Probe
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-sandbox-probe.mjs"
      - ".github/workflows/tiktok-sandbox-probe.yml"
permissions:
  contents: read
concurrency:
  group: mmf-tiktok-sandbox-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary app icon
        shell: bash
        run: |
          python3 - <<'PY'
          import struct,zlib
          W=H=1024; bg=(18,24,38); fg=(245,247,250); px=bytearray()
          for y in range(H):
              row=bytearray([0])
              for x in range(W):
                  c=bg
                  if 160<=x<=220 and 250<=y<=770:c=fg
                  if 300<=x<=360 and 250<=y<=770:c=fg
                  if 220<=x<=300 and 250<=y<=430:c=fg
                  if 430<=x<=490 and 250<=y<=770:c=fg
                  if 570<=x<=630 and 250<=y<=770:c=fg
                  if 490<=x<=570 and 250<=y<=430:c=fg
                  if 700<=x<=760 and 250<=y<=770:c=fg
                  if 760<=x<=885 and 250<=y<=310:c=fg
                  if 760<=x<=850 and 480<=y<=540:c=fg
                  row.extend(c)
              px.extend(row)
          def chunk(t,d):return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          data=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',W,H,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(px),9))+chunk(b'IEND',b'')
          open('/tmp/mmf-tiktok-icon.png','wb').write(data)
          PY
          chmod 644 /tmp/mmf-tiktok-icon.png
      - name: Patch reliable Sandbox entry and apply confirmation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/vps/tiktok-sandbox-probe.mjs')
          s=p.read_text()
          a=s.index('async function sandbox(){')
          b=s.index('async function persisted(){')
          entry=r'''async function domClick(label,top=false){return ev(`(()=>{const q=${JSON.stringify(label)},v=e=>!!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length)),es=[...document.querySelectorAll('*')].filter(v).filter(e=>(e.innerText||e.textContent||'').replace(/\\s+/g,' ').trim()===q).map(e=>({e,r:e.getBoundingClientRect()})).filter(x=>x.r.width*x.r.height>0&&x.r.y>=0&&x.r.y<=innerHeight);if(!es.length)return 0;es.sort((a,b)=>${top?'a.r.y-b.r.y||(a.r.width*a.r.height)-(b.r.width*b.r.height)':'(a.r.width*a.r.height)-(b.r.width*b.r.height)||a.r.y-b.r.y'});let e=es[0].e;for(let i=0;i<5&&e;i++,e=e.parentElement){if(e.matches('button,a,[role="button"],[role="tab"]')){e.click();return 1}}es[0].e.click();return 1})()`)}async function sandbox(){for(let i=0;i<50;i++){if((await txt()).includes('You are editing '+N))return 1;if(await domClick('Sandbox',true)){await sleep(1200);break}await sleep(300)}for(let i=0;i<50;i++){if((await txt()).includes('You are editing '+N))return 1;if(await domClick(N,false)){await sleep(900);if((await txt()).includes('You are editing '+N))return 1}await sleep(300)}return 0}'''
          s=s[:a]+entry+s[b:]
          a=s.index('async function apply(){')
          b=s.index('async function addProduct(')
          apply=r'''async function apply(){if(!await click('Apply changes'))return 0;await sleep(900);const state=JSON.parse(await ev(`JSON.stringify((()=>{const v=e=>!!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length)),c=x=>String(x||'').replace(/\\s+/g,' ').trim().slice(0,180),safe=s=>/apply|confirm|continue|save|cancel|close|required|error|invalid|verify|unsaved|change|success|updated/i.test(s);const dialogs=[...document.querySelectorAll('[role="dialog"],dialog')].filter(v).filter(d=>!/AI Assistant/i.test(d.innerText||'')).map(d=>({text:(d.innerText||'').split(/\\n+/).map(c).filter(safe).slice(0,12),buttons:[...d.querySelectorAll('button,[role="button"]')].filter(v).map(b=>c(b.innerText||b.textContent)).filter(safe).slice(0,12)}));const lines=(document.body?.innerText||'').split(/\\n+/).map(c).filter(safe).filter(x=>!/AI Assistant/i.test(x)).slice(0,30);const alerts=[...document.querySelectorAll('[role="alert"],[role="status"],.toast,.Toast,.ant-message,.ant-notification')].filter(v).map(e=>c(e.innerText||e.textContent)).filter(safe).slice(0,12);return{dialogs,lines,alerts}})())`)||'{}');console.log('APPLY_STATE='+JSON.stringify(state));const chosen=await ev(`(()=>{const v=e=>!!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length)),ds=[...document.querySelectorAll('[role="dialog"],dialog')].filter(v).filter(d=>!/AI Assistant/i.test(d.innerText||''));for(const d of ds.reverse()){const bs=[...d.querySelectorAll('button,[role="button"]')].filter(v).filter(b=>!b.disabled&&b.getAttribute('aria-disabled')!=='true');const b=bs.find(x=>/^(Confirm|Apply changes|Apply|Continue|Save)$/i.test((x.innerText||x.textContent||'').replace(/\\s+/g,' ').trim()));if(b){const t=(b.innerText||b.textContent||'').replace(/\\s+/g,' ').trim();b.click();return t}}return ''})()`);console.log('APPLY_CONFIRM='+JSON.stringify(chosen));await sleep(chosen?3200:2200);const after=JSON.parse(await ev(`JSON.stringify((()=>{const v=e=>!!(e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length)),c=x=>String(x||'').replace(/\\s+/g,' ').trim().slice(0,180),safe=s=>/apply|confirm|continue|save|required|error|invalid|verify|unsaved|change|success|updated/i.test(s);return{lines:(document.body?.innerText||'').split(/\\n+/).map(c).filter(safe).filter(x=>!/AI Assistant/i.test(x)).slice(0,30),alerts:[...document.querySelectorAll('[role="alert"],[role="status"],.toast,.Toast,.ant-message,.ant-notification')].filter(v).map(e=>c(e.innerText||e.textContent)).filter(safe).slice(0,12)}})())`)||'{}');console.log('APPLY_AFTER='+JSON.stringify(after));return 1}'''
          p.write_text(s[:a]+apply+s[b:])
          PY
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9247' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Configure sandbox safely
        shell: bash
        run: node scripts/vps/tiktok-sandbox-probe.mjs
