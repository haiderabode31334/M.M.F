name: M.M.F TikTok Target Status

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-target-status.mjs"
      - ".github/workflows/tiktok-target-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-target-status
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9261' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Verify TikTok target account and scopes
        shell: bash
        run: node scripts/vps/tiktok-target-status.mjs
