name: M.M.F TikTok Credential Probe

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-credential-probe.mjs"
      - ".github/workflows/tiktok-credential-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-credential-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9263' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Probe TikTok credential controls safely
        shell: bash
        run: node scripts/vps/tiktok-credential-probe.mjs
