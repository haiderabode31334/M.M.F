name: MMF Drive Transfer

on:
  push:
    branches:
      - tmp/mmf-drive-transfer

jobs:
  upload-source:
    runs-on: self-hosted
    steps:
      - name: Upload MMF Social Hub source tree
        uses: actions/upload-artifact@v4
        with:
          name: mmf-social-hub-v1-source-tree
          path: /home/github-runner/mmf-transfer/source-tree
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 1
# refresh: direct-source-tree-2026-09-08
