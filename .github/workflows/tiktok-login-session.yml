name: M.M.F TikTok Login Session

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-login-session.sh"
      - "scripts/vps/tiktok-login-local.mjs"
      - ".github/workflows/tiktok-login-session.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-login-session
  cancel-in-progress: true

jobs:
  login-session:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start private local TikTok login session
        shell: bash
        run: |
          if [ -f "$HOME/mmf-browser-state/tiktok-login-complete" ]; then
            echo 'TIKTOK_AUTH_MARKER=1'
            exit 0
          fi
          bash scripts/vps/tiktok-login-session.sh
