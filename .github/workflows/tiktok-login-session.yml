name: M.M.F TikTok Login Session

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tiktok-login-session.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-login-session
  cancel-in-progress: true

jobs:
  login-session:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2
    steps:
      - name: Retire legacy login session
        shell: bash
        run: |
          echo 'LEGACY_TIKTOK_LOGIN_WORKFLOW_RETIRED=1'
          exit 0
