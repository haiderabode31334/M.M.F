name: M.M.F TikTok URL Verify Stage3

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vps/tiktok-url-verify-stage3.mjs"
      - ".github/workflows/tiktok-url-verify-stage3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmf-tiktok-url-verify-stage3
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        shell: bash
        run: |
          sudo -n true
          pkill -u "$(id -u)" -f '[r]emote-debugging-port=9237' 2>/dev/null || true
          rm -f "$HOME/mmf-browser-profile/SingletonLock" "$HOME/mmf-browser-profile/SingletonSocket" "$HOME/mmf-browser-profile/SingletonCookie"
      - name: Inspect TikTok URL prefix verification fields
        shell: bash
        run: node scripts/vps/tiktok-url-verify-stage3.mjs
